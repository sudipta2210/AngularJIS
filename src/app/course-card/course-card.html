<div class="course-card">
     <div class="course-title">
        {{fCourse?.description}}
     </div>
     <img width="300" [src]="fCourse?.iconUrl">
     <div class="course-description">
         {{fCourse?.longDescription}}
     </div>
     <div class="course-category">
          <div class="category">{{fCourse?.category}}</div>
     </div>
     <button (click)="FnViewCourse()">View Course</button>
</div>
