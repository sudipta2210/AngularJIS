<div class="container">
  <header class="modal-header">
    <h3>COURSE LIST</h3>
  </header>
</div>
<div>
  <table class="table table-success table-striped table-bordered">
      <tr>
        <th>Course Name</th>
        <th>Category</th>
        <th>Description</th>
        <th>Leasson count</th>
      </tr>
      @for(item of COURSELST;track item.id)
      {
          <tr>
            <td>{{item.description}}</td>
            <td>{{item.category}}</td>
            <td>{{item.longDescription}}</td>
            <td>{{item.lessonsCount}}</td>
          </tr>
      }
  </table>
</div>
