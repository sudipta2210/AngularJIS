<div class="top-menu">
  <img class="logo" src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">
</div>
<div class="courses">
  @for(course of courseList;track course.id)
  {
    <course-card (OnSelectedCourse)="FnOnCourseSelected($event)"  [dataFromParent]="course" ></course-card>
  }
  @empty{
  <h3>No Courses Available!!!</h3>
  }
</div>
